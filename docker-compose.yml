# docker compose up -d --build     → build from this repo and start
# docker compose logs -f           → follow logs
# docker compose down              → stop and remove
#
# To run the published image instead of building, remove "build:" and set
# "image:" to your Docker Hub repo, davidshawcodes/webdnschecker:latest

services:
  webdnschecker:
    build: .
    image: webdnschecker:latest
    container_name: webdnschecker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Server used for "Default". Leave empty to use the container's resolver
      # (on a compose network that is Docker's embedded DNS, 127.0.0.11, which
      # forwards to the host's DNS and can also resolve other compose services).
      DEFAULT_DNS: "${DEFAULT_DNS:-}"
      QUERY_TIMEOUT_MS: "${QUERY_TIMEOUT_MS:-5000}"
      RATE_LIMIT: "${RATE_LIMIT:-60}"
      # Set to true when running behind a reverse proxy that sets X-Forwarded-For.
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    # Alternative to DEFAULT_DNS: change the container's resolver itself.
    # dns:
    #   - 192.168.1.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
