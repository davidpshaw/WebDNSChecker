# Runs the published image from Docker Hub. This file works on its own,
# e.g. pasted into Dockhand, Portainer or another compose UI.
#
#   docker compose up -d       → pull and start
#   docker compose pull && docker compose up -d   → update to newest release
#   docker compose down        → stop and remove
#
# To build from source instead (inside a clone of the repo):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  webdnschecker:
    image: davidshawcodes/webdnschecker:latest
    container_name: webdnschecker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Server used for "Default". Leave empty to use the container's resolver
      # (on a compose network that is Docker's embedded DNS, 127.0.0.11, which
      # forwards to the host's DNS and can also resolve other compose services).
      DEFAULT_DNS: "${DEFAULT_DNS:-}"
      QUERY_TIMEOUT_MS: "${QUERY_TIMEOUT_MS:-5000}"
      RATE_LIMIT: "${RATE_LIMIT:-60}"
      # Set to true when running behind a reverse proxy that sets X-Forwarded-For.
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    # Alternative to DEFAULT_DNS: change the container's resolver itself.
    # dns:
    #   - 192.168.1.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
