<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>DNS Checker</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span>DNS Checker</span>
    </div>
    <button type="button" id="themeBtn" class="icon-btn" aria-label="Theme: auto" title="Theme: auto">
      <svg class="ico-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      <svg class="ico-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <main class="wrap">
    <form id="queryForm" class="card" autocomplete="off" novalidate>
      <div class="row query-row">
        <label class="field grow">
          <span class="label">Domain or IP</span>
          <input id="name" name="name" type="text" inputmode="url" placeholder="example.com"
                 autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" required>
        </label>
        <label class="field type-field">
          <span class="label">Type</span>
          <select id="type" name="type"></select>
        </label>
      </div>

      <fieldset class="field">
        <legend class="label">DNS server</legend>
        <div class="segmented" role="radiogroup">
          <label><input type="radio" name="mode" value="default" checked><span>Default <small id="defaultServerLabel"></small></span></label>
          <label><input type="radio" name="mode" value="custom"><span>Custom</span></label>
        </div>
        <div id="customBox" class="custom-box" hidden>
          <input id="server" name="server" type="text" inputmode="url" list="serverHistory"
                 placeholder="1.1.1.1, 192.168.1.1:5353 or [2001:db8::1]:53"
                 autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Custom DNS server">
          <datalist id="serverHistory"></datalist>
          <div id="chips" class="chips" aria-label="Recent servers"></div>
        </div>
      </fieldset>

      <button type="submit" id="submitBtn" class="primary">
        <span class="btn-text">Look up</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="results-bar">
        <div class="segmented small" role="radiogroup" aria-label="Result view">
          <label><input type="radio" name="view" value="summary" checked><span>Summary</span></label>
          <label><input type="radio" name="view" value="dig"><span>Dig</span></label>
        </div>
        <div class="bar-actions">
          <button type="button" id="copyBtn" class="ghost">Copy</button>
          <button type="button" id="shareBtn" class="ghost">Share link</button>
        </div>
      </div>
      <div id="output"></div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <footer class="foot">Queries run from the server, not your browser.</footer>
</body>
</html>
