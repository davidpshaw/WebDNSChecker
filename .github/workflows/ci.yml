name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: webdnschecker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name wdc -p 8080:8080 webdnschecker:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/ -o /dev/null
          curl -sf http://localhost:8080/api/config
          echo
          curl -sf "http://localhost:8080/api/query?name=example.com&type=A&server=1.1.1.1" | grep -q '"rcode":"NOERROR"'
          echo "Query OK"

      - name: Container logs
        if: always()
        run: docker logs wdc || true
